name: Сборка приложения

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: eye-gym-app

jobs:
  windows:
    name: Windows — установщик и портативная версия
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Проверки
        run: npm test
      - name: Распознавание лица — библиотека и модель
        run: npm run vendor
      - name: Сборка .exe
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: EyeGym-Windows
          path: eye-gym-app/dist/EyeGym-*.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  android:
    name: Android — APK
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Распознавание лица — библиотека и модель
        run: npm run vendor
      - name: Проект Android (Capacitor)
        run: npx cap add android
      - name: Значки приложения
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor "#1B2436" --iconBackgroundColorDark "#1B2436" --splashBackgroundColor "#121826" --splashBackgroundColorDark "#121826"
      - name: Разрешения камеры и уведомлений
        run: node scripts/android-patch.mjs
      - name: Синхронизация
        run: npx cap sync android
      - name: Сборка APK
        working-directory: eye-gym-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Имя файла
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "EyeGym-Android-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: EyeGym-Android
          path: eye-gym-app/EyeGym-Android-*.apk
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  release:
    name: Публикация в Releases
    needs: [windows, android]
    if: ${{ !cancelled() && (needs.windows.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Гимнастика для глаз — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
